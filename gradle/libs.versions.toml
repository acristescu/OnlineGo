room = { id = "androidx.room", version.ref = "room" }

[bundles]
compose = [
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-ui-util"
]

work = [
    "work-runtime-ktx"
]

koin = [
    "koin-android"
]

testing = [
    "junit",
    "mockito-kotlin",
    "mockito-inline",
    "koin-test-junit4",
    "arch-core-testing",
    "coroutines-test",
    "turbine"
]

android-testing = [
    "androidx-test-ext-junit",
    "androidx-test-runner",
    "androidx-test-rules",
    "espresso-core"
] 