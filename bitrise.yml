format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

workflows:
  deploy:
    triggers:
      - push_branch: release
    description: |
      ## Deployment workflow for Sente
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - set-java-version@1:
          inputs:
            - set_java_version: '17'
      - script@1:
          inputs:
            - content: sdkmanager "cmake;3.31.6"
      - git-clone@8: { }
      - cache-pull@2: { }
      - file-downloader@1:
          inputs:
            - destination: "$BITRISE_SOURCE_DIR/app/google-services.json"
            - source: "$BITRISEIO_GOOGLE_SERVICES_JSON_URL"
      - change-android-versioncode-and-versionname@1:
          inputs:
            - version_code_offset: '53'
            - build_gradle_path: "$PROJECT_LOCATION/$MODULE/build.gradle.kts"
      - android-unit-test@1:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: "$TEST_VARIANT"
      - android-build@1:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: release
            - build_type: apk
      - android-build@1:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: release
            - build_type: aab
      - android-signer@1:
          run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
      - github-release@1:
          inputs:
            - username: "$GITHUB_USERNAME"
            - name: "v$BITRISE_BUILD_NUMBER"
            - body: "Automated release build $BITRISE_BUILD_NUMBER"
            - draft: 'no'
            - tag: "v$BITRISE_BUILD_NUMBER"
            - commit: release
            - files_to_upload: "$BITRISE_SIGNED_APK_PATH"
            - api_token: "$GITHUB_TOKEN"
      - google-play-deploy@3:
          inputs:
            - package_name: io.zenandroid.onlinego
            - track: production
            - app_path: "$BITRISE_SIGNED_AAB_PATH"
            - service_account_json_key_path: "$BITRISEIO_SERVICE_ACCOUNT_JSON_KEY_URL"
      - deploy-to-bitrise-io@2: { }
      - cache-push@2: { }

  primary:
    triggers:
      - push_branch: master
      - pull_request_source_branch:
          regex: '^(?!.*l10n_master).*'
        pull_request_target_branch: master
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - set-java-version@1:
          inputs:
            - set_java_version: '17'
      - git-clone@8: { }
      - cache-pull@2: { }
      - file-downloader@1:
          inputs:
            - destination: "$BITRISE_SOURCE_DIR/app/google-services.json"
            - source: "$BITRISEIO_GOOGLE_SERVICES_JSON_URL"
      - android-unit-test@1:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: "$TEST_VARIANT"
      - deploy-to-bitrise-io@2: { }
      - cache-push@2: { }

app:
  envs:
    - opts:
        is_expand: false
      PROJECT_LOCATION: "."
    - opts:
        is_expand: false
      GRADLEW_PATH: gradlew
    - opts:
        is_expand: false
      MODULE: app
    - opts:
        is_expand: false
      BUILD_VARIANT: Debug
    - opts:
        is_expand: false
      TEST_VARIANT: Debug

meta:
  bitrise.io:
    stack: linux-docker-android-22.04