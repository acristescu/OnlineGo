format_version: '5'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
trigger_map:
  - push_branch: master
    workflow: primary
  - push_branch: release
    workflow: deploy
  - pull_request_source_branch:
      regex: "/^(?!.*l10n_master).*/"
    workflow: primary
workflows:
  deploy:
    description: |
      ## How to get a signed APK

      This workflow contains the **Sign APK** step. To sign your APK all you have to do is to:

      1. Click on **Code Signing** tab
      1. Find the **ANDROID KEYSTORE FILE** section
      1. Click or drop your file on the upload file field
      1. Fill the displayed 3 input fields:
       1. **Keystore password**
       1. **Keystore alias**
       1. **Private key password**
      1. Click on **[Save metadata]** button

      That's it! From now on, **Sign APK** step will receive your uploaded files.

      ## To run this workflow

      If you want to run this workflow manually:

      1. Open the app's build list page
      2. Click on **[Start/Schedule a Build]** button
      3. Select **deploy** in **Workflow** dropdown input
      4. Click **[Start Build]** button

      Or if you need this workflow to be started by a GIT event:

      1. Click on **Triggers** tab
      2. Setup your desired event (push/tag/pull) and select **deploy** workflow
      3. Click on **[Done]** and then **[Save]** buttons

      The next change in your repository that matches any of your trigger map event will start **deploy** workflow.
    steps:
      - activate-ssh-key@4.1:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - set-java-version@1:
          inputs:
            - set_java_version: '17'
      - script@1:
          inputs:
            - content: sdkmanager "cmake;3.31.6"
      - git-clone@6.2: { }
      - cache-pull@2.7: { }
      - file-downloader@1.1:
          inputs:
            - destination: "$BITRISE_SOURCE_DIR/app/google-services.json"
            - source: "$BITRISEIO_GOOGLE_SERVICES_JSON_URL"
      - git::https://github.com/viktorbenei/bitrise-step-install-android-ndk-version.git@master:
          inputs:
            - android_ndk_version: r19b
      - change-android-versioncode-and-versionname@1.3:
          inputs:
            - version_code_offset: '53'
            - build_gradle_path: "$PROJECT_LOCATION/$MODULE/build.gradle.kts"
      - android-unit-test@1.0:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: "$TEST_VARIANT"
      - android-build@1.0:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: release
            - build_type: apk
      - android-build@1.0:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: release
            - build_type: aab
      - sign-apk@1.7:
          run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
          inputs:
            - android_app: |-
                $BITRISE_APK_PATH
                $BITRISE_AAB_PATH
            - use_apk_signer: 'true'
            - signer_scheme: v2
      - github-release@0:
          inputs:
            - username: "$GITHUB_USERNAME"
            - name: "$ANDROID_VERSION_NAME$ANDROID_VERSION_CODE"
            - body: "$ANDROID_VERSION_NAME$ANDROID_VERSION_CODE"
            - draft: 'no'
            - tag: "$ANDROID_VERSION_NAME$ANDROID_VERSION_CODE"
            - commit: release
            - files_to_upload: "$BITRISE_SIGNED_APK_PATH"
            - api_token: "$GITHUB_TOKEN"
      - google-play-deploy@3.8:
          inputs:
            - package_name: io.zenandroid.onlinego
            - track: production
            - app_path: "$BITRISE_SIGNED_AAB_PATH"
            - service_account_json_key_path: "$BITRISEIO_SERVICE_ACCOUNT_JSON_KEY_URL_URL"
      - deploy-to-bitrise-io@2.0: { }
      - cache-push@2.7: { }
  primary:
    steps:
      - activate-ssh-key@4.1:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - set-java-version@1.2.1:
          inputs:
            - set_java_version: '17'
      - script@1:
          inputs:
            - content: sdkmanager "cmake;3.10.2.4988404"
      - git-clone@6.2: { }
      - cache-pull@2.7: { }
      - file-downloader@1.1:
          inputs:
            - destination: "$BITRISE_SOURCE_DIR/app/google-services.json"
            - source: "$BITRISEIO_GOOGLE_SERVICES_JSON_URL"
      - git::https://github.com/viktorbenei/bitrise-step-install-android-ndk-version.git@master:
          inputs:
            - android_ndk_version: r19b
      - android-unit-test@1.0:
          inputs:
            - project_location: "$PROJECT_LOCATION"
            - module: "$MODULE"
            - variant: "$TEST_VARIANT"
      - deploy-to-bitrise-io@2.0: { }
      - cache-push@2.7: { }
app:
  envs:
    - opts:
        is_expand: false
      PROJECT_LOCATION: "."
    - opts:
        is_expand: false
      GRADLEW_PATH: gradlew
    - opts:
        is_expand: false
      MODULE: app
    - opts:
        is_expand: false
      BUILD_VARIANT: Debug
    - opts:
        is_expand: false
      TEST_VARIANT: Debug
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
